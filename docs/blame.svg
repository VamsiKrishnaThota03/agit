<text x="146.0" y="274.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">│</text>
<text x="154.0" y="274.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve">     Commas inside a quoted field are literal, and a doubled quote inside a</text>
