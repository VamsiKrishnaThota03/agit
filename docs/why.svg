<text x="34.0" y="217.0" fill="#e6e9ef" opacity="1.00" font-weight="600" xml:space="preserve">because</text>
<text x="18.0" y="236.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve">  Replace the naive split with a single-pass scanner: a comma inside quotes is literal</text>
<text x="18.0" y="255.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve">  data, and a doubled quote is an escaped quote. Unquoted fields keep the old trimming</text>
<text x="18.0" y="274.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve">  so existing callers see no change.</text>
<text x="34.0" y="312.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">task          </text>
<text x="146.0" y="312.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">asked of the agent:</text>
<text x="34.0" y="331.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">csvkit.parse_row splits on every comma, so commas inside quoted fields break the row.</text>
<text x="34.0" y="350.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">Fix it, with a test that proves it.</text>
<text x="34.0" y="388.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">full model request/response: git -C .agit/ledger show d9f8fee790:steps/0005/</text>
