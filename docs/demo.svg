<svg xmlns="http://www.w3.org/2000/svg" width="852" height="594" viewBox="0 0 852 594" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
<rect width="852" height="594" rx="10" fill="#0c0f14"/>
<rect width="852" height="30" rx="10" fill="#161b24"/>
<rect y="20" width="852" height="10" fill="#161b24"/>
<circle cx="18" cy="15" r="4.5" fill="#ff6b6b"/>
<circle cx="35" cy="15" r="4.5" fill="#ffd166"/>
<circle cx="52" cy="15" r="4.5" fill="#3ddc97"/>
<text x="426" y="19.5" fill="#8b96a8" font-size="11.5" text-anchor="middle">agit demo  ·  offline, no API key, deterministic</text>
<text x="34.0" y="65.0" fill="#ff9933" opacity="1.00" font-weight="600" xml:space="preserve">agit</text>
<text x="66.0" y="65.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">  git for AI agents</text>
<text x="34.0" y="84.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">offline demo: no API key, no network, deterministic</text>
<text x="34.0" y="122.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">workspace     </text>
<text x="146.0" y="122.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve">agit-demo</text>
<text x="34.0" y="141.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">planner       </text>
<text x="146.0" y="141.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve">bundled script (script.json)</text>
<text x="34.0" y="160.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">done when     </text>
<text x="146.0" y="160.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve">python3 -m unittest discover -q -p &quot;test_*.py&quot; .</text>
<text x="34.0" y="198.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">  the demo auto-approves the shell commands in the bundled script</text>
<text x="34.0" y="236.0" fill="#3ddc97" opacity="1.00" xml:space="preserve">●</text>
<text x="50.0" y="236.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">step 01</text>
<text x="114.0" y="236.0" fill="#b48ead" opacity="1.00" xml:space="preserve">ls    </text>
<text x="162.0" y="236.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve"> .   </text>
<text x="202.0" y="236.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">377 tok</text>
<text x="66.0" y="255.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">Orient myself in the workspace before touching anything.</text>
<text x="34.0" y="274.0" fill="#3ddc97" opacity="1.00" xml:space="preserve">●</text>
<text x="50.0" y="274.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">step 02</text>
<text x="114.0" y="274.0" fill="#b48ead" opacity="1.00" xml:space="preserve">read  </text>
<text x="162.0" y="274.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve"> csvkit.py   </text>
<text x="266.0" y="274.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">482 tok</text>
<text x="66.0" y="293.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">Read the parser so the fix is based on what the code actually does, not what the name suggests.</text>
<text x="34.0" y="312.0" fill="#3ddc97" opacity="1.00" xml:space="preserve">●</text>
<text x="50.0" y="312.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">step 03</text>
<text x="114.0" y="312.0" fill="#b48ead" opacity="1.00" xml:space="preserve">write </text>
<text x="162.0" y="312.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve"> test_quoted.py   </text>
<text x="306.0" y="312.0" fill="#3ddc97" opacity="1.00" xml:space="preserve">+25</text>
<text x="338.0" y="312.0" fill="#ff6b6b" opacity="1.00" xml:space="preserve">-0</text>
<text x="370.0" y="312.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">1.0k tok</text>
<text x="66.0" y="331.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">Pin the bug with a failing test first, so the fix is provable rather than plausible.</text>
<text x="34.0" y="350.0" fill="#ff6b6b" opacity="1.00" xml:space="preserve">●</text>
<text x="50.0" y="350.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">step 04</text>
<text x="114.0" y="350.0" fill="#b48ead" opacity="1.00" xml:space="preserve">run   </text>
<text x="162.0" y="350.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve"> python3 -m unittest -q test_quoted   </text>
<text x="466.0" y="350.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">1.4k tok</text>
<text x="66.0" y="369.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">Confirm the new test fails for the stated reason before changing any logic.</text>
<text x="34.0" y="388.0" fill="#3ddc97" opacity="1.00" xml:space="preserve">●</text>
<text x="50.0" y="388.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">step 05</text>
<text x="114.0" y="388.0" fill="#b48ead" opacity="1.00" xml:space="preserve">write </text>
<text x="162.0" y="388.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve"> csvkit.py   </text>
<text x="266.0" y="388.0" fill="#3ddc97" opacity="1.00" xml:space="preserve">+40</text>
<text x="298.0" y="388.0" fill="#ff6b6b" opacity="1.00" xml:space="preserve">-2</text>
<text x="330.0" y="388.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">2.7k tok</text>
<text x="66.0" y="407.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">Replace the naive split with a single-pass scanner: a comma inside quotes is literal data, and a</text>
<text x="34.0" y="426.0" fill="#3ddc97" opacity="1.00" xml:space="preserve">●</text>
<text x="50.0" y="426.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">step 06</text>
<text x="114.0" y="426.0" fill="#b48ead" opacity="1.00" xml:space="preserve">run   </text>
<text x="162.0" y="426.0" fill="#e6e9ef" opacity="1.00" xml:space="preserve"> python3 -m unittest discover -q -p &quot;test_*.py&quot;   </text>
<text x="562.0" y="426.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">3.2k tok</text>
<text x="66.0" y="445.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">Run the whole suite, not just the new test, to prove the old behaviour still holds.</text>
<text x="34.0" y="464.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">  verify: python3 -m unittest discover -q -p &quot;test_*.py&quot; .</text>
<text x="34.0" y="483.0" fill="#ff9933" opacity="1.00" xml:space="preserve">●</text>
<text x="50.0" y="483.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">step 07</text>
<text x="114.0" y="483.0" fill="#b48ead" opacity="1.00" xml:space="preserve">finish</text>
<text x="194.0" y="483.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">3.4k tok</text>
<text x="274.0" y="483.0" fill="#3ddc97" opacity="1.00" xml:space="preserve">✓ verified</text>
<text x="66.0" y="502.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">Both the new and the old tests pass, so the task is done.</text>
<rect x="34.0" y="527.5" width="80.0" height="17.0" rx="2" fill="#3ddc97"/>
<text x="34.0" y="540.0" fill="#0c0f14" opacity="1.00" xml:space="preserve"> VERIFIED </text>
<text x="122.0" y="540.0" fill="#e6e9ef" opacity="0.56" xml:space="preserve">python3 -m unittest discover -q -p &quot;test_*.py&quot; .</text>
</svg>
